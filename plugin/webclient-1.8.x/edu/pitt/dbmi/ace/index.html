<!DOCTYPE html>
<html>
    <head>
        <title>ENACT ACE</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/globals.min.css" />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <div class="container py-4">
            <header class="bg-white/80 backdrop-blur-sm top-0 z-50">
                <div class="flex items-center justify-between py-4">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-violet-600 flex items-center justify-center">
                            <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5" />
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-lg font-bold text-gray-900">ENACT ACE</h1>
                            <p class="text-xs text-gray-700">Automated Clinical Evidence</p>
                        </div>
                    </div>
                </div>
            </header>
            <main class="py-4">
                <div class="flex border-b border-gray-200" role="tablist" aria-label="Tabs">
                    <button class="tab-btn px-4 py-2 text-sm font-medium text-blue-600 focus:outline-none transition-all" id="home_tab" role="tab" aria-selected="true" aria-controls="home_tab_pane" data-target="home_tab_pane">ACE Generation</button>
                    <button class="tab-btn px-4 py-2 text-sm font-medium text-gray-500 focus:outline-none transition-all" id="about_tab" role="tab" aria-selected="true" aria-controls="about_tab_pane" data-target="about_tab_pane">About</button>
                </div>
                <div class="mt-4">
                    <div class="tab-panel text-sm text-gray-600" id="home_tab_pane" role="tabpanel" aria-labelledby="home_tab">
                        <h3 class="text-base font-semibold text-gray-900 mb-1">Account details</h3>
                        <p>Manage your public profile settings and email configurations here.</p>
                    </div>
                    <div class="tab-panel text-sm text-gray-600" id="about_tab_pane" role="tabpanel" aria-labelledby="about_tab">
                        <h3 class="text-base font-semibold text-gray-900 mb-1">About</h3>
                        <p>Manage your public profile settings and email configurations here.</p>
                    </div>
                </div>
            </main>
        </div>
        <script>
            const tabs = document.querySelectorAll('.tab-btn');
            const panels = document.querySelectorAll('.tab-panel');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // 1. reset all tabs to inactive state
                    tabs.forEach(t => {
                        t.setAttribute('aria-selected', 'false');
                        t.classList.remove('border-blue-600', 'text-blue-600');
                        t.classList.add('border-transparent', 'text-gray-500');
                    });

                    // 2. hide all content panels
                    panels.forEach(p => p.classList.add('hidden'));

                    // 3. set chosen tab to active
                    tab.setAttribute('aria-selected', 'true');
                    tab.classList.add('border-blue-600', 'text-blue-600');
                    tab.classList.remove('border-transparent', 'text-gray-500');

                    // 4. reveal targeted panel
                    const targetId = tab.getAttribute('data-target');
                    document.getElementById(targetId).classList.remove('hidden');
                });
            });
        </script>
    </body>
</html>
